# Pull-request check: compile the firmware of GatewayLab with PlatformIO (and run the native
# unit tests when the project has them). Nothing is flashed.
# Generated by morfTools scripts/gen-ci-workflows.py: change the generator, not this file.
name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      # secrets.h is never versioned: the example is enough to compile.
      - name: Placeholder secrets
        run: cp include/secrets_example.h include/secrets.h

      - name: Unit tests (native)
        run: pio test -e native

      - name: Build esp32s3_n16r8
        run: pio run -e esp32s3_n16r8
