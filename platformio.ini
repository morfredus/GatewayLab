; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description  = Gateway Lab - Découverte et inventaire des appareils sur le réseau local
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
; Plateforme OFFICIELLE PlatformIO uniquement, epinglee pour la reproductibilite. On n'utilise PAS
; pioarduino ni Tasmota (flash a 95 %, cache PlatformIO corrompu, page PIO Home detournee).
; Les plateformes officielles (6.12.0, 7.1.3) livrent Arduino 2.0.17 : pas de core 3.x officiel.
; Attention : un projet pointant sur une URL pioarduino/Tasmota peut remplacer le coeur PlatformIO
; de ~/.platformio/penv ; ne jamais en ouvrir un dans cet environnement.
platform      = espressif32@7.1.3
board         = esp32-s3-devkitc-1-n16r8v
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

board_build.usb_mode        = "cdc"
board_build.usb_cdc_on_boot = 1
board_build.filesystem      = littlefs

; Ressources web : générées à CHAQUE compilation par tools/custom_hooks.py (-> tools/minify_web.py).
;   web_src/*.html, *.js, styles.css  ->  include/web_interface*.h
;   data/oui.json                     ->  include/oui_table.h
; Ces en-têtes ne sont PAS versionnés : ils sont ignorés par Git (voir .gitignore) et n'existent
; pas dans un clone neuf. Seules les sources (web_src/, data/oui.json) le sont. Un lancement
; manuel reste possible : python tools/minify_web.py
;
; Une section ne peut porter qu'UNE clé extra_scripts : les deux scripts sont donc listés
; ensemble plus bas. Une seconde clé écraserait la première et version.py cesserait
; silencieusement de s'exécuter (PROJECT_VERSION introuvable à la compilation).


build_unflags =
    -std=gnu++11
    -std=gnu++14

; PROJECT_VERSION n'est PAS ecrit ici : il est injecte par tools/version.py
; depuis le fichier VERSION a la racine, qui fait autorite comme dans les autres
; projets de l'ecosysteme. Deux endroits pour une meme valeur finissent toujours
; par diverger.
extra_scripts =
    pre:tools/version.py
    pre:tools/custom_hooks.py

build_flags =
    -std=gnu++17
    -D PROJECT_NAME='"GatewayLab"'
    -D TARGET_ESP32_S3

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit NeoPixel@^1.12.3
